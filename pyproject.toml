[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "git-shadow"
version = "0.1.0"
description = "Git clones the repo. Shadow overlays the secrets. Instant cloud workspace projection for remote AI agents."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Epodak & Antigravity" }
]
keywords = ["git", "ai", "remote-development", "shadow-workspace", "opencode", "claude-code", "ssh"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.scripts]
git-shadow = "git_shadow.cli:main"
